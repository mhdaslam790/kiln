# Databases for the integration suite:
#   docker compose -f integration/docker-compose.yml up -d
#   make test-all
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: kiln
    ports: ["55432:5432"]
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: kiln
    ports: ["53306:3306"]
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Secret_Passw0rd"
    ports: ["51433:1433"]
  redis:
    image: redis:7
    ports: ["56379:6379"]
